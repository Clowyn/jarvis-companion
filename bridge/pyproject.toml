[project]
name = "jarvis-bridge"
version = "1.0.0"
description = "Async Python Bridge and MCP Server for Jarvis Minecraft Companion Mod"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
jarvis-mcp = "jarvis_bridge.mcp_server:main"
